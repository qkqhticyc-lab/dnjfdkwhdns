name: Telegram market risk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['telegram-risk/**', 'scripts/telegram-risk.mjs', 'tests/telegram-risk.test.mjs', '.github/workflows/telegram-risk.yml']
  schedule:
    - cron: '35 22,23 * * 1-5'
    - cron: '35 0,2 * * 2-6'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-market-risk
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/telegram-risk.test.mjs
      - name: Restore last notification ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow telegram-risk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name telegram-risk-state --dir .cache/telegram-risk
          fi
      - name: Collect and preview or send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_RISK_ENABLED }}
        run: |
          if [ "$TELEGRAM_ENABLED" = 'true' ]; then
            node scripts/telegram-risk.mjs --send
          else
            node scripts/telegram-risk.mjs
          fi
      - name: Ensure an initial ledger exists
        run: |
          mkdir -p .cache/telegram-risk
          if [ ! -f .cache/telegram-risk/state.json ]; then
            printf '%s' '{"schemaVersion":1,"sent":[]}' > .cache/telegram-risk/state.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-risk-state
          overwrite: true
          path: .cache/telegram-risk/state.json
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-risk-preview
          overwrite: true
          path: |
            .cache/telegram-risk/preview.txt
            .cache/telegram-risk/report.json
            .cache/telegram-risk/preview.html
          include-hidden-files: true
          retention-days: 14
