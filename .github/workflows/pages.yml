name: Publish investment note
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Scan listed stocks']
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .cache/research
          key: research-v1-${{ github.run_id }}
          restore-keys: research-v1-
      - run: npm run collect:research
      - uses: actions/cache@v4
        with:
          path: .cache/news
          key: news-v1-${{ github.run_id }}
          restore-keys: news-v1-
      - run: npm run collect:news
      - run: node scripts/collect-market.mjs
      - run: node scripts/collect-us-futures.mjs
      - run: npm run collect:credit
      - run: npm run collect:indicators
      - run: node scripts/collect-indicator-history.mjs
      - name: Download latest completed full scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scan_id=$(gh run list --workflow screener.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$scan_id" ]; then
            gh run download "$scan_id" --name screener-full --dir .cache/screener-full || echo 'Full scan download unavailable; keeping published data.'
          fi
      - run: node scripts/load-screener.mjs
      - uses: actions/cache@v4
        with:
          path: .cache/position-monitor
          key: position-monitor-v1-${{ github.run_id }}
          restore-keys: position-monitor-v1-
      - run: node scripts/collect-position-monitor.mjs
      - run: node scripts/collect-sectors.mjs
      - run: npm run collect:sentiment
      - run: npm run collect:etfs
      - run: node scripts/refresh-club.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
